version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mineintel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mineintel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mineintel_password}
      POSTGRES_DB: ${POSTGRES_DB:-mineintel_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mineintel_user} -d ${POSTGRES_DB:-mineintel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
